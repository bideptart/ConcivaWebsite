<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <style>
      .logo-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 82px; }
    </style>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 5)">
    <!-- Headband -->
    <path d="M 32 68 C 32 28, 118 28, 118 68" fill="none" stroke="#FF5E00" stroke-width="12" stroke-linecap="round" />

    <!-- Left Ear Cup (Speech Bubble shape) -->
    <path d="M 22 62 C 22 53, 29 46, 38 46 L 54 46 C 63 46, 70 53, 70 62 L 70 86 C 70 95, 63 102, 54 102 L 36 102 L 18 114 L 20 100 C 14 96, 10 89, 10 82 Z" fill="#FF5E00" />

    <!-- Soundwaves inside Left Ear Cup -->
    <!-- Bar 1 (Dot) -->
    <circle cx="27" cy="74" r="3.5" fill="white" />
    <!-- Bar 2 -->
    <line x1="36" y1="64" x2="36" y2="84" stroke="white" stroke-width="6" stroke-linecap="round" />
    <!-- Bar 3 (Center tall) -->
    <line x1="46" y1="58" x2="46" y2="90" stroke="white" stroke-width="6" stroke-linecap="round" />
    <!-- Bar 4 -->
    <line x1="56" y1="64" x2="56" y2="84" stroke="white" stroke-width="6" stroke-linecap="round" />
    <!-- Bar 5 (Dot) -->
    <circle cx="63" cy="74" r="3.5" fill="white" />

    <!-- Right Ear Cup -->
    <rect x="114" y="60" width="18" height="42" rx="9" fill="#FF5E00" />

    <!-- Mic Boom Arm -->
    <path d="M 123 100 C 123 125, 80 134, 56 127" fill="none" stroke="#FF5E00" stroke-width="7" stroke-linecap="round" />
    
    <!-- Mic Capsule -->
    <rect x="42" y="121" width="14" height="10" rx="5" fill="#FF5E00" />
  </g>

  <!-- BRAND TEXT -->
  <text x="175" y="112" class="logo-text" fill="#0B0F19">Conciva<tspan fill="#FF5E00">AI</tspan></text>
</svg>
