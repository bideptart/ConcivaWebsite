<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');

:root {
  color-scheme: dark;

  --conciva-background: 222 32% 7%;
  --conciva-foreground: 24 28% 96%;
  --conciva-card: 221 27% 10%;
  --conciva-card-foreground: 24 24% 95%;
  --conciva-popover: 221 27% 11%;
  --conciva-popover-foreground: 24 24% 95%;
  --conciva-primary: 13 93% 66%;
  --conciva-primary-foreground: 222 35% 8%;
  --conciva-muted: 220 16% 18%;
  --conciva-muted-foreground: 217 18% 72%;
  --conciva-border: 221 16% 22%;
  --conciva-input: 221 16% 22%;
  --conciva-ring: 13 93% 66%;

  --conciva-radius-sm: 8px;
  --conciva-radius-md: 12px;
  --conciva-radius-lg: 16px;

  --state-success: 151 58% 52%;
  --state-warning: 39 96% 63%;
  --state-error: 0 82% 64%;
  --state-info: 202 92% 63%;

  --conciva-font-display: 'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --conciva-font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;

  --grid-max-width: 1220px;
  --hero-glow: radial-gradient(circle at 50% 0%, rgba(255, 122, 89, 0.22), transparent 42%);
  --panel-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
}

.dark {
  color-scheme: dark;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--conciva-font-sans);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--conciva-background);
    --color-foreground: var(--conciva-foreground);
    --color-card: var(--conciva-card);
    --color-card-foreground: var(--conciva-card-foreground);
    --color-popover: var(--conciva-popover);
    --color-popover-foreground: var(--conciva-popover-foreground);
    --color-primary: var(--conciva-primary);
    --color-primary-foreground: var(--conciva-primary-foreground);
    --color-muted: var(--conciva-muted);
    --color-muted-foreground: var(--conciva-muted-foreground);
    --color-border: var(--conciva-border);
    --color-input: var(--conciva-input);
    --color-ring: var(--conciva-ring);
    --radius-sm: var(--conciva-radius-sm);
    --radius-md: var(--conciva-radius-md);
    --radius-lg: var(--conciva-radius-lg);
  }
  @layer base {
    body { background: var(--conciva-background); color: var(--conciva-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .bg-primary { background-color: var(--conciva-primary); }

      .border-primary { border-color: var(--conciva-primary); }
      .ring-primary { --tw-ring-color: var(--conciva-primary); }
      .bg-primary-foreground { background-color: var(--conciva-primary-foreground); }
      .text-primary-foreground { color: var(--conciva-primary-foreground); }
      .border-primary-foreground { border-color: var(--conciva-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--conciva-primary-foreground); }
      .bg-muted { background-color: var(--conciva-muted); }

      .bg-border { background-color: var(--conciva-border); }

      .border-border { border-color: var(--conciva-border); }

      .ring-ring { --tw-ring-color: var(--conciva-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

</head>
